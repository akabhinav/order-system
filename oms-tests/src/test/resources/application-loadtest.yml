spring:
  application:
    name: order-service-test
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:tc:postgresql:16:///oms?TC_TMPFS=/testtmpfs:rw
    username: oms
    password: oms
    hikari:
      maximum-pool-size: 20
      connection-timeout: 3000
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      group:
        readiness:
          include: db,redis
        liveness:
          include: ping

resilience4j:
  circuitbreaker:
    instances:
      payment-gateway:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedCallsInHalfOpenState: 3
      inventory-service:
        slidingWindowSize: 20
        failureRateThreshold: 60
        waitDurationInOpenState: 15s
  retry:
    instances:
      payment-gateway:
        maxAttempts: 3
        waitDuration: 500ms
  bulkhead:
    instances:
      payment-gateway:
        maxConcurrentCalls: 25
        maxWaitDuration: 500ms
  ratelimiter:
    instances:
      place-order:
        limitForPeriod: 10000
        limitRefreshPeriod: 1s
        timeoutDuration: 0

oms:
  idempotency:
    ttl-hours: 24
  outbox:
    poll-interval-ms: 100
    batch-size: 100
  saga:
    timeout-minutes: 15
