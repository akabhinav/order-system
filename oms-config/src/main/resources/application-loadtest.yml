spring:
  application:
    name: order-service-loadtest
  threads:
    virtual:
      enabled: true
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
  datasource:
    url: jdbc:postgresql://localhost:5432/oms
    username: oms
    password: oms
    hikari:
      maximum-pool-size: 50
      connection-timeout: 3000
      keepalive-time: 30000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: localhost
      port: 6379
      lettuce:
        pool:
          max-active: 32
          max-idle: 16
  kafka:
    bootstrap-servers: localhost:9092

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,metrics

resilience4j:
  circuitbreaker:
    instances:
      payment-gateway:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedCallsInHalfOpenState: 3
      inventory-service:
        slidingWindowSize: 20
        failureRateThreshold: 60
        waitDurationInOpenState: 15s
  retry:
    instances:
      payment-gateway:
        maxAttempts: 3
        waitDuration: 500ms
  bulkhead:
    instances:
      payment-gateway:
        maxConcurrentCalls: 25
        maxWaitDuration: 500ms
  ratelimiter:
    instances:
      place-order:
        limitForPeriod: 10000
        limitRefreshPeriod: 1s
        timeoutDuration: 0

oms:
  idempotency:
    ttl-hours: 24
  outbox:
    poll-interval-ms: 100
    batch-size: 100
  saga:
    timeout-minutes: 15
