spring:
  application:
    name: order-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/oms}
    username: ${DB_USER:oms}
    password: ${DB_PASSWORD:oms}
    hikari:
      maximum-pool-size: 20
      connection-timeout: 3000
      keepalive-time: 30000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
  kafka:
    bootstrap-servers: ${KAFKA_BROKERS:localhost:9092}
    producer:
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        compression.type: lz4
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
      properties:
        max.poll.records: 50

server:
  shutdown: graceful

spring.lifecycle:
  timeout-per-shutdown-phase: 30s

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus,info
  endpoint:
    health:
      group:
        readiness:
          include: db,redis
        liveness:
          include: ping
  metrics:
    export:
      prometheus:
        enabled: true

resilience4j:
  circuitbreaker:
    instances:
      payment-gateway:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedCallsInHalfOpenState: 3
        slowCallDurationThreshold: 2s
        slowCallRateThreshold: 80
      inventory-service:
        slidingWindowSize: 20
        failureRateThreshold: 60
        waitDurationInOpenState: 15s
  retry:
    instances:
      payment-gateway:
        maxAttempts: 3
        waitDuration: 500ms
  bulkhead:
    instances:
      payment-gateway:
        maxConcurrentCalls: 25
        maxWaitDuration: 500ms
  ratelimiter:
    instances:
      place-order:
        limitForPeriod: 10000
        limitRefreshPeriod: 1s
        timeoutDuration: 0

oms:
  idempotency:
    ttl-hours: 24
  outbox:
    poll-interval-ms: 100
    batch-size: 100
  saga:
    timeout-minutes: 15
